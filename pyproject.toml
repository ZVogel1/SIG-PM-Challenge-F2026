[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmcup"
version = "0.1.0"
description = "Predictions Cup trading system for SIG midterms competition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
]

[project.scripts]
pmcup = "pmcup.cli:app"

[tool.setuptools.packages.find]
where = ["src"]